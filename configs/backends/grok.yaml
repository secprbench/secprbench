# The paper reached this model through a private Anthropic-compatible
# gateway. Set base_url and egress_hosts to your own endpoint before use.
name: grok
display_name: Grok 4.6 via an Anthropic-compatible gateway
claude_version: 2.1.283
base_url: https://gateway.example.com
api_key_env: SECPRBENCH_GROK_API_KEY
model: grok-4.6
small_model: grok-4.6
env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
  API_TIMEOUT_MS: '600000'
egress_hosts:
- gateway.example.com
cutoff_date: null
