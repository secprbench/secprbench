name: wasmtime
repo_url: https://github.com/bytecodealliance/wasmtime.git
project:
  name: wasmtime
  display_name: Wasmtime
  repo: bytecodealliance/wasmtime
  language: Rust
context:
  description: 'Wasmtime is a standalone WebAssembly runtime built on the Cranelift
    and

    Winch code generators. It embeds the wasmtime-wasi implementations of

    WASIp1, WASIp2 (component model), and wasi-http, exposes a public

    Rust API plus a C API, and supports a pooling instance allocator. The

    critical security boundary is between untrusted guest wasm and the

    host: any host panic, out-of-sandbox read/write, or miscompiled guest

    memory access counts as a vulnerability.

    '
  input_sources: 'untrusted WebAssembly modules (core wasm and components) supplied
    by a

    guest, WASIp1 syscall arguments (paths, file descriptors, fd_renumber,

    path_open flags), WASIp2 component-model values transcoded across the

    canonical ABI (UTF-16 <-> latin1+utf16, flags, resources), wasi-http

    request/response types, host-provided linker resources cloned through

    wasmtime::Linker, and C-API calls that pass externref/anyref handles.

    '
  assertion_macros: "debug_assert!() and assert!() panic in host code \u2014 a reachable\
    \ host\npanic from a guest input is a DoS bug, never a safety net. unreachable!(),\n\
    unwrap(), and expect() likewise indicate a broken invariant if a guest\ncan trigger\
    \ them. unsafe { } blocks and Cranelift/Winch codegen paths\nhave no runtime guard;\
    \ violating an invariant there yields\nmiscompilation, sandbox escape, or out-of-bounds\
    \ heap access.\n"
  common_bug_types:
  - SandboxEscape (Cranelift/Winch miscompilation, aarch64 heap access, table.grow
    masking)
  - OutOfBoundsRead (component-model string transcoding, UTF-16 to latin1+utf16 helpers)
  - OutOfBoundsWrite (component-model transcode writes, canonical-ABI flags lifting)
  - HostPanic (fd_renumber, table.fill on Winch, dropping [Typed]Func::call_async
    futures)
  - UseAfterFree (wasmtime::Linker cloning, host-to-wasm component intrinsics)
  - HostFilesystemBypass (wasmtime-wasi FilePerms bypass via hard link/rename/TRUNCATE)
  - MemoryLeak (C API externref/anyref lifetimes, WASIp1 fd_renumber leak)
  - DataLeak (pooling allocator instance cross-contamination, 64-bit tables under
    Winch)
  file_patterns:
  - crates/wasmtime/**/*.rs
  - crates/wasi/**/*.rs
  - crates/wasi-http/**/*.rs
  - crates/cranelift/**/*.rs
  - crates/winch/**/*.rs
  - crates/environ/**/*.rs
  - crates/component-util/**/*.rs
  - crates/c-api/**/*.rs
verify:
  name: wasmtime
  image: anypoc-wasmtime:latest
  repo_url: https://github.com/bytecodealliance/wasmtime.git
  build_script: "set -Eeuo pipefail\n# Git writes relative paths into submodule .git\
    \ files. Use the same absolute\n# checkout path on host and container, rather\
    \ than the /work mount alias.\ncd \"${CGSA_WORKTREE_PATH:?Runner must provide\
    \ the canonical worktree path}\"\nexport CARGO_HOME=/verify-cache/cargo\nexport\
    \ RUSTUP_HOME=/verify-cache/rustup\nmkdir -p \"$CARGO_HOME\" \"$RUSTUP_HOME\"\n\
    toolchain=\"${CGSA_VERIFY_RUST_TOOLCHAIN:-$(python3 .verify_wasmtime_toolchain.py)}\"\
    \n[[ \"$toolchain\" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {\n    echo\
    \ \"Expected a dated nightly toolchain, got: $toolchain\" >&2; exit 2;\n}\necho\
    \ \"Wasmtime historical toolchain: $toolchain\" > build_toolchain.log\n# The image's\
    \ /usr/local/bin/rustup wrapper overrides RUSTUP_HOME. Call the\n# raw executable\
    \ and explicitly select real compiler binaries to avoid the\n# image's standalone\
    \ cargo/rustc 1.98 taking precedence over rustup proxies.\n/opt/cargo/bin/rustup\
    \ toolchain install \"$toolchain\" --profile minimal \\\n    --no-self-update\
    \ --no-update >> build_toolchain.log 2>&1\nexport RUSTC=\"$(/opt/cargo/bin/rustup\
    \ which --toolchain \"$toolchain\" rustc)\"\nexport RUSTDOC=\"$(/opt/cargo/bin/rustup\
    \ which --toolchain \"$toolchain\" rustdoc)\"\nexport PATH=\"$(dirname \"$RUSTC\"\
    ):$PATH\"\nexport RUSTUP_TOOLCHAIN=\"$toolchain\"\nunset RUSTC_BOOTSTRAP\nrustc\
    \ --version >> build_toolchain.log\ncargo --version >> build_toolchain.log\nprintf\
    \ '%s\\n' \"$toolchain\" > .verify_toolchain\nsource_head=\"$(git rev-parse HEAD)\"\
    \nsource_diff=\"$(git -c diff.ignoreSubmodules=all diff HEAD --binary | sha256sum)\"\
    \ngit submodule update --init --recursive > build_configure.log 2>&1\n# An explicit\
    \ target keeps host build scripts/proc macros outside ASan.\nexport RUSTFLAGS='-Zsanitizer=address\
    \ -Cforce-frame-pointers=yes'\nexport CFLAGS='-g -O1 -fsanitize=address -fno-omit-frame-pointer'\n\
    export CXXFLAGS=\"$CFLAGS\"\ncargo build --locked --release --target x86_64-unknown-linux-gnu\
    \ \\\n    --bin wasmtime -j \"${CGSA_BUILD_JOBS:-8}\" > build_compile.log 2>&1\n\
    test -x target/x86_64-unknown-linux-gnu/release/wasmtime\n[[ \"$(git rev-parse\
    \ HEAD)\" == \"$source_head\" \\\n   && \"$(git -c diff.ignoreSubmodules=all diff\
    \ HEAD --binary | sha256sum)\" == \"$source_diff\" ]] || {\n    echo 'Wasmtime\
    \ build changed tracked source; refusing this build.' >&2; exit 2;\n}\n"
  harness_source: null
  harness_build: ''
  run_cmd: ./target/x86_64-unknown-linux-gnu/release/wasmtime "$INPUT"
  build_artifacts:
  - target/x86_64-unknown-linux-gnu/release/wasmtime
  run_env:
    ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:allocator_may_return_null=1
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    CARGO_HOME: /verify-cache/cargo
    RUSTUP_HOME: /verify-cache/rustup
    RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
  build_timeout: 7200
  run_timeout: 300
  build_network: bridge
  build_cache: true
  build_git_mounts: true
  build_support_files:
  - wasmtime_toolchain.py
